<!doctype html>
<html lang="en" data-app-src="app.js?v=f6aab3ace4" data-build="f6aab3ace4">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1118" media="(prefers-color-scheme: dark)">
<meta name="description" content="Lean Loken: your 12-week lean-out plan, log and coach.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lean Loken">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Lean Loken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone = sticky top bar + bottom tabs; desktop (>=980px) = fixed left sidebar + 2-column workspace. One type family (Plex) in three cuts. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F7F8FA; --sunken:#EDF0F4; --ink:#0F1A2A; --ink-2:#344154; --muted:#5A687D; --line:#E2E6EC; --line-2:#CED5DE;
  --accent:#2350D8; --accent-hover:#1C42B8; --accent-ink:#FFFFFF; --accent-soft:#E9EEFD;
  --good:#0E7352; --good-soft:#E2F4EC; --warn:#9A4E06; --warn-soft:#FDF0D8; --bad:#C2352B; --bad-soft:#FCE7E5; --run:#CF4A1C;
  --check-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --f-cond:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --r-s:8px; --ctl:#7C899B;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1118; --surface:#141B24; --surface-2:#18202B; --sunken:#0F151D; --ink:#E7EDF4; --ink-2:#C3CDD8; --muted:#8C99A8; --line:#2A3542; --line-2:#38475A;
  --accent:#7398FF; --accent-hover:#8FADFF; --accent-ink:#0A1224; --accent-soft:#1A2648;
  --good:#3DBE86; --good-soft:#12291F; --warn:#E1A23E; --warn-soft:#2E2412; --bad:#F2716A; --bad-soft:#3A1A19; --run:#FF7D4D;
  --check-ink:#0A1224; --shadow:none; --ctl:#5C6B7E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1118; --surface:#141B24; --surface-2:#18202B; --sunken:#0F151D; --ink:#E7EDF4; --ink-2:#C3CDD8; --muted:#8C99A8; --line:#2A3542; --line-2:#38475A;
  --accent:#7398FF; --accent-hover:#8FADFF; --accent-ink:#0A1224; --accent-soft:#1A2648;
  --good:#3DBE86; --good-soft:#12291F; --warn:#E1A23E; --warn-soft:#2E2412; --bad:#F2716A; --bad-soft:#3A1A19; --run:#FF7D4D;
  --check-ink:#0A1224; --shadow:none; --ctl:#5C6B7E; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 100px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.15}
h1{font-family:var(--f-cond);font-weight:700;font-size:30px;letter-spacing:-.01em}
h2{font-family:var(--f-cond);font-weight:700;font-size:22px}
h3{font-size:15.5px;font-weight:600}
p{margin:0}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[aria-invalid="true"]{border-color:var(--bad)!important;color:var(--bad)!important}

/* shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);margin-inline:-16px;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-cond);font-weight:700;font-size:20px;letter-spacing:.01em}
.logo .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo .mark svg{width:16px;height:16px;stroke:var(--accent-ink);fill:none;stroke-width:2.4;stroke-linecap:round}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--bad)} .sync.local i{background:var(--warn)} .sync.saving i{background:var(--accent)}
.side{display:none}
.main{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.navbtn{border:none;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.navbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.navbtn.on{color:var(--accent)}
@media (min-width:980px){
  body{padding:0 32px 48px 264px}
  .topbar,.tabs{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px}
  .side .logo{padding:0 8px 18px}
  .side .navbtn{flex-direction:row;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink-2);justify-content:flex-start}
  .side .navbtn:hover{background:var(--surface-2)}
  .side .navbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .side .sync{margin:auto 8px 0}
  .main{padding-top:28px}
}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h .sub{font-size:13px;color:var(--muted)}
.card-b{padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:var(--r-s);padding:9px 14px;font-weight:600;font-size:14px;background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--accent-hover)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.sec:hover{background:var(--surface-2)}
.btn.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:38px;height:38px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.run{background:var(--bad-soft);color:var(--run)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunken);border-radius:var(--r-s);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;border-radius:6px;padding:6px 11px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.note{font-size:13px;color:var(--muted)}
.callout{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-s);background:var(--accent-soft);color:var(--ink);font-size:14px}
.callout.warn{background:var(--warn-soft)}
.callout b{font-weight:600}
.callout .btn{margin-left:auto}

/* page head */
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead .t{flex:1;min-width:180px}
.datepick{position:relative}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.strip button b{font-family:var(--f-cond);font-size:19px;color:var(--ink);line-height:1.1}
.strip button .bar{width:58%;height:4px;border-radius:2px;background:var(--sunken);overflow:hidden;margin-top:2px}
.strip button .bar i{display:block;height:100%}
.strip button.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.strip button.today b{color:var(--accent)}

/* brief */
.brief{display:grid;grid-template-columns:1fr auto;gap:16px;padding:18px;align-items:center}
.brief .what{display:flex;flex-direction:column;gap:8px;min-width:0}
.brief .lead{color:var(--ink-2);font-size:14.5px;max-width:62ch}
.kpis{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.kpis b{display:block;font-family:var(--f-cond);font-size:19px;color:var(--ink);font-weight:700}
.ring{width:92px;height:92px;position:relative;flex:none}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset .35s ease}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-family:var(--f-cond);font-size:24px;line-height:1}
.ring .lbl small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:980px){.cols{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}

/* timeline */
.tl{list-style:none;margin:0;padding:6px 0}
.tl li{display:grid;grid-template-columns:70px 18px minmax(0,1fr) auto;gap:0 10px;padding:0 16px;position:relative}
.tl .tm{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:13px;text-align:right;white-space:nowrap}
.tl .rail{position:relative;display:flex;justify-content:center}
.tl .rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.tl li:first-child .rail::before{top:18px} .tl li:last-child .rail::before{bottom:calc(100% - 18px)}
.tl .dot{position:relative;margin-top:14px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.tl li.k-meal .dot{border-color:var(--good)} .tl li.k-train .dot{border-color:var(--accent)} .tl li.k-run .dot{border-color:var(--run)}
.tl li.done .dot{background:var(--good);border-color:var(--good)}
.tl .body{padding:10px 0 12px;min-width:0;border-bottom:1px solid var(--line)}
.tl li:last-child .body{border-bottom:0}
.tl .body h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tl .body h3 .kc{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.tl .body p{font-size:13px;color:var(--muted)}
.tl li.done .body h3{color:var(--muted)}
.tl .act{padding-top:8px}
.foods{margin:8px 0 2px;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.foods summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--accent);display:flex;justify-content:space-between;gap:8px;background:var(--surface-2)}
.foods summary::-webkit-details-marker{display:none}
.foods summary::after{content:"Show";font-weight:500;color:var(--muted)}
.foods[open] summary::after{content:"Hide"}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 10px;border-top:1px solid var(--line);font-size:13px}
.food .q{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--ink-2)}
.food .m{grid-column:1/-1;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.food.tot{background:var(--surface-2);font-weight:600}

/* check */
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;flex:none;padding:0;transition:background .15s,border-color .15s}
.chk:hover{border-color:var(--good)}
.chk svg{width:16px;height:16px;stroke:var(--check-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.done>.act>.chk,.chk.on{background:var(--good);border-color:var(--good)}
.done>.act>.chk svg,.chk.on svg{opacity:1}
.chk.auto{border-style:dashed;cursor:default}
.chk.auto:hover{border-color:var(--line-2)}
.done>.act>.chk.auto{border-style:solid}

/* habits list */
.hl{list-style:none;margin:0;padding:0}
.hl li{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-top:1px solid var(--line)}
.hl li:first-child{border-top:0}
.hl .tx{flex:1;min-width:0}
.hl .tx b{font-weight:500;display:block}
.hl .tx span{font-size:12.5px;color:var(--muted)}
.hl li.done .tx b{color:var(--muted)}
.hl .act{order:-1}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap;align-self:center}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:16px}
.nf{border:1px solid var(--line-2);border-radius:10px;padding:8px 10px 7px;display:flex;flex-direction:column;gap:1px;min-width:0;background:var(--surface);transition:border-color .15s}
.nf:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.nf label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nf input{width:100%;border:none;background:transparent;font-family:var(--f-cond);font-weight:700;font-size:26px;color:var(--ink);padding:0;min-width:0;font-variant-numeric:tabular-nums;outline:none}
.nf input::placeholder{color:var(--line-2)}
.nf .tgt{font-size:11.5px;color:var(--muted)}
.nf.hit{border-color:var(--good)} .nf.hit .tgt{color:var(--good);font-weight:600}
.nf.miss .tgt{color:var(--warn);font-weight:600}
.nf.bad{border-color:var(--bad)} .nf.bad .tgt{color:var(--bad)}
textarea{width:100%;min-height:84px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--surface);color:var(--ink);font:inherit;padding:10px 12px;resize:vertical}

/* train */
.ex{display:flex;flex-direction:column;gap:8px;padding:16px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex-h h3{font-size:16px}
.rx{font-family:var(--f-mono);font-size:13px;color:var(--accent);white-space:nowrap}
.last{font-size:12.5px;color:var(--muted)}
.last b{color:var(--ink-2);font-family:var(--f-mono);font-weight:500;font-size:12px}
.sets{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr);gap:6px 8px;align-items:center;max-width:420px}
.sets .sn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sets .hd{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sets input{width:100%;min-width:0;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);font:500 16px var(--f-mono);padding:8px 10px;font-variant-numeric:tabular-nums}
.sets input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.timer{border-radius:var(--r-s);padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--sunken);transition:background .3s}
.timer.run{background:var(--bad-soft)} .timer.walk{background:var(--good-soft)} .timer.done{background:var(--accent-soft)}
.timer .ph{font-family:var(--f-cond);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.timer.run .ph{color:var(--run)} .timer.walk .ph{color:var(--good)} .timer.done .ph{color:var(--accent)}
.timer .clock{font-family:var(--f-cond);font-weight:700;font-size:80px;line-height:.9;font-variant-numeric:tabular-nums}
.timer .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);gap:8px;flex-wrap:wrap}
.tbar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ink)}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{padding:14px 16px}
.tile .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-cond);font-weight:700;font-size:30px;line-height:1.15}
.tile .s{font-size:12.5px;color:var(--muted)}
.coach{border-left:4px solid var(--accent)}
.coach.good{border-left-color:var(--good)} .coach.warn{border-left-color:var(--warn)} .coach.bad{border-left-color:var(--bad)}
.chartbox{overflow-x:auto;padding:8px 12px 12px}
.chartbox svg{display:block;width:100%;min-width:340px;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;min-width:520px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12.5px}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left}
tr.cur td{background:var(--accent-soft)}
.dn{color:var(--good)} .up{color:var(--bad)}
.grid12{display:grid;grid-template-columns:36px repeat(7,minmax(0,1fr));gap:5px;font-size:11px;color:var(--muted);align-items:center;padding:16px;max-width:460px}
.grid12 .c{aspect-ratio:1;border-radius:5px;background:var(--sunken);border:none;padding:0;width:100%}
.grid12 .c.g{background:var(--good)} .grid12 .c.w{background:var(--warn)} .grid12 .c.b{background:var(--bad)} .grid12 .c.f{background:transparent;border:1px dashed var(--line-2)}
.grid12 .c.t{outline:2px solid var(--accent);outline-offset:1px}

/* plan */
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
details.sec>summary{list-style:none;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none;margin-right:4px}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec>summary h2{font-size:19px}
.dbody{padding:0 16px 18px;display:flex;flex-direction:column;gap:10px;max-width:72ch}
.dbody ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.dbody h4{margin:6px 0 0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fix{display:grid;grid-template-columns:auto 1fr;gap:8px 12px}
.fix .n{font-family:var(--f-mono);font-size:12px;color:var(--accent);padding-top:2px}
.sched{display:grid;grid-template-columns:48px 1fr}
.sched>div{padding:8px 0;border-top:1px solid var(--line)}
.sched>div:nth-child(-n+2){border-top:0}
.sched .d{font-family:var(--f-cond);font-weight:700}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.form input{border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);font:500 15px var(--f-mono);padding:8px 10px;width:100%;min-width:0}
.form input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.target-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.target-big b{font-family:var(--f-cond);font-size:40px;line-height:1}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.macros div{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px}
.macros b{display:block;font-family:var(--f-cond);font-size:22px}
.macros span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13.5px;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2);display:flex;gap:12px;align-items:center}
.toast button{background:none;border:none;color:var(--accent-soft);font-weight:600;padding:0;text-decoration:underline}
@media (min-width:980px){.toast{bottom:28px;left:calc(50% + 116px)}}
.skip{position:absolute;left:-999px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ---- integrator: global ergonomics (44px targets, type roles) ---- */
.icon-btn{width:44px;height:44px}
.btn{min-height:44px}
.btn.sm{min-height:40px}
@media (max-width:979px){.btn.sm{min-height:44px}}
.seg button{padding:10px 14px;min-height:40px}
.card-h h2,details.sec>summary h2{font-family:var(--f-body);font-size:18px;font-weight:600;letter-spacing:0}
.weekfocus{background:var(--good-soft)}
.weekfocus b{font-size:15px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* integrator: control borders meet WCAG 1.4.11 (3:1) */
input:not([type=checkbox]):not([type=radio]),textarea,select,.chk,.nf{border-color:var(--ctl)}
.nf.hit{border-color:var(--good)}.nf.miss{border-color:var(--warn)}.nf.bad{border-color:var(--bad)}
[hidden]{display:none!important}
/* ===== TODAY (Builder C). Every rule is scoped under .tdv so it wins over styles.css, which loads after this file. ===== */
.tdv{display:flex;flex-direction:column;gap:14px;min-width:0}
.tdv .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tdv .phead{gap:8px;flex-wrap:nowrap}
.tdv .phead .t{min-width:0}
.tdv .phead h1{font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdv .phead .btn.sm{min-height:44px}
.tdv .icon-btn{width:44px;height:44px}
.tdv .strip{gap:5px}
.tdv .strip button{min-height:56px}

/* --- top: summary + focus --- */
.tdv .td-top{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.tdv .brief{grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:16px;align-items:center}
.tdv .brief .what{gap:7px}
.tdv .brief h2{font-size:24px}
.tdv .brief .lead{font-size:14px}
.tdv .brief .lead.td-dl{display:none}
.tdv .c4s{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tdv .c4{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface)}
.tdv .c4 i{width:9px;height:9px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.tdv .c4.on{background:var(--good-soft);border-color:transparent;color:var(--good)}
.tdv .c4.on i{background:var(--good);border-color:var(--good)}
.tdv .c4sub{font-size:12.5px;color:var(--muted)}
.tdv .c4sub b{color:var(--ink);font-weight:600}
.tdv .ring{width:88px;height:88px}
.tdv .ring svg{width:88px;height:88px}
.tdv .ring circle{transition:stroke .25s}
.tdv .ring .lbl b{font-size:26px}
.tdv .ring .lbl small{letter-spacing:.04em}

.tdv .focus{padding:0;overflow:hidden;border-color:var(--line-2)}
.tdv .fx-main{padding:16px;display:flex;flex-direction:column;gap:8px}
.tdv .fx-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tdv .fx-tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--sunken);color:var(--ink-2)}
.tdv .fx-tag.now{background:var(--accent);color:var(--accent-ink)}
.tdv .fx-tag.good{background:var(--good);color:var(--check-ink)}
.tdv .fx-when{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.tdv .fx-title{font-size:23px;line-height:1.15}
.tdv .fx-det{font-size:14px;color:var(--ink-2)}
.tdv .fx-foods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tdv .fx-foods li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.tdv .fx-foods b{font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--ink-2);text-align:right;white-space:nowrap}
.tdv .fx-tot{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tdv .fx-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.tdv .fx-go{min-height:48px;font-size:15px;padding:0 22px;flex:1 1 140px}
.tdv .fx-2{min-height:48px;flex:0 1 auto}
.tdv .fx-w{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:nowrap}
.tdv .fx-w input{flex:1;min-width:0;height:48px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--surface);color:var(--ink);font:700 22px var(--f-cond);padding:0 12px;font-variant-numeric:tabular-nums}
.tdv .fx-w input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tdv .fx-w .u{color:var(--muted);font-size:13px}
.tdv .fx-w .fx-go{flex:0 0 auto}
.tdv .fx-next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line);background:var(--surface-2);font-size:14px}
.tdv .fx-next .nt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdv .fx-next .nw{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.tdv .fx-late{padding:10px 16px 6px;border-top:1px solid var(--line);background:var(--warn-soft)}
.tdv .fx-late .eyebrow{color:var(--warn)}
.tdv .fx-late ul{list-style:none;margin:2px 0 0;padding:0}
.tdv .fx-late li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.tdv .fx-late .tm{font-family:var(--f-mono);font-size:12px;color:var(--warn)}
.tdv .fx-late .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdv .fx-late .btn{min-height:40px;min-width:72px;background:var(--surface)}

.tdv .td-setup{align-items:center;padding:8px 8px 8px 14px;font-size:13.5px}
.tdv .td-setup .btn{min-height:40px}

/* --- finish yesterday --- */
.tdv .bf{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;border-left:3px solid var(--warn)}
.tdv .bf-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tdv .bf-h h2{font-size:17px}
.tdv .bf-h .sub{font-size:12.5px;color:var(--muted)}
.tdv .bf-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.tdv .bf-f{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 6px;border:1px solid var(--line-2);border-radius:var(--r-s);padding:4px 10px 5px}
.tdv .bf-f span{grid-column:1/-1;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tdv .bf-f input{border:none;background:none;color:var(--ink);font:700 20px var(--f-cond);padding:0;min-width:0;width:100%;height:30px;outline:none}
.tdv .bf-f small{font-size:11.5px;color:var(--muted)}
.tdv .bf-f:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tdv .bf-f.hit{border-color:var(--good)}
.tdv .bf-f.bad{border-color:var(--bad)}

/* --- timeline --- */
.tdv .tl li{grid-template-columns:44px 12px minmax(0,1fr) 44px;gap:0 10px;padding:0 12px 0 10px}
.tdv .tl .tm{font-size:12px;padding-top:15px}
.tdv .tl .dot{margin-top:17px;width:12px;height:12px}
.tdv .tl li:first-child .rail::before{top:22px}
.tdv .tl li:last-child .rail::before{bottom:calc(100% - 22px)}
.tdv .tl .body{padding:12px 0 12px;display:flex;flex-direction:column;gap:6px}
.tdv .tl .body h3{line-height:1.3;gap:4px 8px}
.tdv .tl .body h3 .kc{font-size:11.5px}
.tdv .tl .body{grid-column:3/5;grid-row:1;min-height:54px}
.tdv .tl li.info .body,.tdv .tl li.nowln .body{min-height:0}
.tdv .tl .act{grid-column:4;grid-row:1;align-self:start;position:relative;z-index:1;padding-top:4px;display:flex;justify-content:flex-end}
.tdv .tl .body>h3,.tdv .tl .body>p{padding-right:54px}
.tdv .tl .chk{width:44px;height:44px;border-radius:10px}
.tdv .tl .chk svg{width:20px;height:20px}
.tdv .tl li.late .tm{color:var(--warn);font-weight:600}
.tdv .tl li.late .dot{border-color:var(--warn)}
.tdv .tl li.done .xd{display:none}
.tdv .tl li.done .body{padding-bottom:10px}
.tdv .tl li.done .body h3 .kc{opacity:.75}
.tdv .tl .kc.was{text-decoration:line-through}
.tdv .tl li.info .body{padding:9px 0;border-bottom-style:dashed}
.tdv .tl li.info .body p{font-size:12.5px;color:var(--muted)}
.tdv .tl li.info .body p b{font-weight:600;color:var(--ink-2)}
.tdv .tl li.info .tm{padding-top:10px;font-size:11.5px}
.tdv .tl li.info .dot{margin-top:14px;width:8px;height:8px;border-width:0;background:var(--line-2)}
.tdv .tl li.nowln .tm{color:var(--accent);font-weight:600;padding-top:0;line-height:18px;margin-top:-9px;position:relative;top:0}
.tdv .tl li.nowln{height:0;position:relative;z-index:1}
.tdv .tl li.nowln .dot{margin-top:-5px;width:10px;height:10px;border:none;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tdv .tl li.nowln .body{padding:0;border:0;position:relative}
.tdv .tl li.nowln .body i{position:absolute;left:-12px;right:0;top:-1px;height:2px;background:var(--accent);border-radius:1px}
.tdv .tl li.nowln .rail::before{display:none}
.tdv .tl li.nowln .tm{background:var(--surface)}
.tdv .mact{display:flex;gap:6px;flex-wrap:wrap}
.tdv .tb{position:relative;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;font-size:12.5px;font-weight:600;padding:0 12px;height:32px}
.tdv .tb::after{content:"";position:absolute;inset:-6px -2px}
.tdv .tb:hover{border-color:var(--accent);color:var(--accent)}
.tdv .tb[aria-expanded="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tdv .tl .foods{margin:0}
.tdv .foods[hidden]{display:none}
.tdv .foods.was .food:not(.tot) span:first-child{text-decoration:line-through;color:var(--muted)}
.tdv .alt{display:flex;flex-direction:column;gap:3px;padding:9px 11px;border-radius:var(--r-s);background:var(--accent-soft)}
.tdv .alt .eyebrow{color:var(--accent);font-size:10.5px}
.tdv .alt b{font-weight:600}
.tdv .alt .kc{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.tdv .alt p{font-size:12.5px;color:var(--muted)}
.tdv .alt .mact{margin-top:4px}

/* --- log --- */
.tdv .nums{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px}
.tdv .nf{padding:9px 12px 9px;gap:2px}
.tdv .nf.wide{grid-column:1/-1}
.tdv .nf-h{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:18px}
.tdv .nf .src{font-size:11px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tdv .nf input{height:36px;font-size:28px}
.tdv .nf[data-nf="weight"] input{font-size:32px;height:42px}
.tdv .nf.hit{border-color:var(--good)}
.tdv .nf.miss{border-color:var(--warn)}
.tdv .nf.miss .tgt{color:var(--warn)}
.tdv .lnk{position:relative;border:none;background:none;padding:0;color:var(--accent);font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.tdv .lnk::after{content:"";position:absolute;inset:-13px -8px}
.tdv .qcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tdv .qc{min-height:44px;min-width:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.tdv .qc:hover{border-color:var(--accent)}
.tdv .qc.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tdv .qc.ghost{background:none;border-style:dashed;color:var(--muted)}
.tdv .qc[hidden]{display:none}
.tdv [data-nf="sleep"] .qcs .qc{flex:1 1 0;min-width:0;padding:0 4px}

/* --- standards --- */
.tdv .hl li{align-items:center;padding:8px 16px}
.tdv .hl .act{order:0}
.tdv .hl .chk{width:44px;height:44px;border-radius:10px}
.tdv .hl .chk svg{width:20px;height:20px}

@media (min-width:980px){
  .tdv{gap:16px}
  .tdv .td-top.has-fx{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}
  .tdv .td-top.has-fx .focus{order:-1}
  .tdv .td-top.has-fx .brief{align-items:start}
  .tdv .brief .lead.td-dl{display:block}
  .tdv .tl li{grid-template-columns:52px 12px minmax(0,1fr) 44px;padding:0 16px 0 12px}
}
@media (max-width:420px){
  .tdv .phead h1{font-size:23px}
  .tdv .brief{padding:14px}
  .tdv .ring,.tdv .ring svg{width:80px;height:80px}
  .tdv .c4{padding:0 8px 0 7px;font-size:12px}
}
/* round 2: off-plan, so-far, wind-down, close-out, lights-out wait */
.tdv .fx-trim,.tdv .tl .trim{font-size:13.5px;color:var(--ink);background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:6px;padding:7px 10px}
.tdv .tl .trim[hidden]{display:none}
.tdv .fx-sofar{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.tdv .fx-info{padding:10px 16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);background:var(--accent-soft)}
.tdv .fx-close{padding:12px 16px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.tdv .fx-cg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tdv .fx-close .qcs{margin-top:0}
.tdv .tl li.wait .chk{display:none}
.tdv .tl .act .wt{display:none;font-size:11px;color:var(--muted);text-align:right;line-height:1.2;padding-top:10px;max-width:44px}
.tdv .tl li.wait .act .wt{display:block}
.tdv .tl li.done .mact .alt-b{border:none;background:none;height:28px;padding:0;color:var(--muted);font-weight:500;text-decoration:underline;text-underline-offset:2px}
/* ===== round 3 ===== */
/* layout: phone = one column in a fixed order; desktop = left (focus, schedule) and right (day card, log, standards, notes) */
.tdv .tdgrid{display:flex;flex-direction:column;gap:14px;min-width:0}
.tdv .gl,.tdv .gr{display:contents}
.tdv .o-brief{order:1}.tdv .o-focus{order:2}.tdv .o-setup{order:3}.tdv .o-bf{order:4}.tdv .o-sched{order:5}.tdv .o-log{order:6}.tdv .o-std{order:7}.tdv .o-notes{order:8}
@media (min-width:980px){
  .tdv .tdgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
  .tdv .gl,.tdv .gr{display:flex;flex-direction:column;gap:16px;min-width:0}
}
.tdv .brief .lead.td-dl{display:none}
@media (min-width:980px){.tdv .brief .lead.td-dl{display:block}}
/* schedule as a collapsible card on today */
.tdv details.td-sched>summary{list-style:none;cursor:pointer;border-bottom:0;min-height:56px}
.tdv details.td-sched>summary::-webkit-details-marker{display:none}
.tdv details.td-sched>summary h2::after{content:"";display:inline-block;width:8px;height:8px;margin-left:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .2s}
.tdv details.td-sched[open]>summary h2::after{transform:rotate(-135deg) translateY(-1px)}
.tdv details.td-sched[open]>summary{border-bottom:1px solid var(--line)}
.tdv .td-sched .card-h .badge{font-weight:600}
/* compact meal links on rows that aren't current or next */
.tdv .mact.sm{gap:14px}
.tdv .tlk{position:relative;border:none;background:none;padding:0;height:24px;font-size:12.5px;font-weight:600;color:var(--accent)}
.tdv .tlk::after{content:"";position:absolute;inset:-10px -6px}
.tdv .tlk.alt-b{color:var(--muted);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.tdv .tlk[aria-expanded="true"]{color:var(--ink)}
/* tap targets + numerals */
.tdv .tb{height:44px;padding:0 14px}
.tdv .tb::after{content:none}
.tdv .tl li.done .mact .alt-b{height:24px}
.tdv .bf-f input{height:40px}
.tdv .tl .tm,.tdv .tl .kc,.tdv .alt .kc,.tdv .food .q,.tdv .food .m,.tdv .fx-next .nw,.tdv .fx-sofar,.tdv .fx-tot,.tdv .fx-when,.tdv .fx-foods b,.tdv .fx-late .tm{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.tdv .tl .tm{font-size:12.5px}
.tdv .fx-sofar{font-size:13px}
/* formatted number overlay (10,400) while a field isn't being edited */
.tdv .nf-in{position:relative}
.tdv .fmtv{position:absolute;inset:0;display:none;align-items:center;font-family:var(--f-cond);font-weight:700;font-size:28px;color:var(--ink);pointer-events:none;font-variant-numeric:tabular-nums}
.tdv .nf.fmt .fmtv{display:flex}
.tdv .nf.fmt input{color:transparent}
.tdv .nf[hidden]{display:none}
/* pre-start */
.tdv .brief.pre{grid-template-columns:minmax(0,1fr) auto;row-gap:12px}
.tdv .brief.pre .row .sub{font-size:12.5px;color:var(--muted)}
.tdv .cdown{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:88px;padding:8px 10px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent);text-align:center}
.tdv .cdown b{font-family:var(--f-cond);font-size:40px;line-height:1}
.tdv .cdown small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tdv .su-wrap{grid-column:1/-1;margin:0 -16px -16px;border-top:1px solid var(--line)}
.tdv .su{list-style:none;margin:0;padding:0}
.tdv .su-i{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line)}
.tdv .su-i:first-child{border-top:0}
.tdv .su-i .chk{width:44px;height:44px;border-radius:10px;flex:none}
.tdv .su-i .chk svg{width:20px;height:20px}
.tdv .su-i .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.tdv .su-i .tx>b{font-weight:600}
.tdv .su-i .tx>span{font-size:13px;color:var(--muted)}
.tdv .su-i.done .tx>b{color:var(--muted)}
.tdv .su-c{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--ink-2)}
.tdv .su-w{display:inline-flex;gap:6px;align-items:center}
.tdv .su-w input{width:96px;height:44px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--surface);color:var(--ink);font:700 18px var(--f-cond);padding:0 10px;font-variant-numeric:tabular-nums}
.tdv .su-w input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tdv .su .btn.sm{min-height:44px}
.tdv .gro summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px;min-height:32px;display:flex;align-items:center}
.tdv .gro ul{list-style:none;margin:4px 0 6px;padding:0;border:1px solid var(--line);border-radius:var(--r-s)}
.tdv .gro li{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink)}
.tdv .gro li:first-child{border-top:0}
.tdv .gro li b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tdv .td-sched.ro .tl li{grid-template-columns:44px 12px minmax(0,1fr)}
.tdv .td-sched.ro .tl .body>h3,.tdv .td-sched.ro .tl .body>p{padding-right:0}
.tdv .td-setup{flex-wrap:wrap}
.tdv .td-setup>span{flex:1 1 180px}
.tdv .td-setup .btn{margin-left:0}
.tdv .td-sched.ro .tl .body{grid-column:3}
.tdv .is-pre .o-log{order:3}
/* ===== final polish ===== */
.tdv .tlk,.tdv .tl li.done .mact .alt-b{display:inline-flex;align-items:center;height:44px;min-height:44px}
.tdv .tlk::after{content:none}
.tdv .mact.sm{margin:-6px 0}
.tdv .lnk{display:inline-flex;align-items:center;min-height:44px;vertical-align:middle}
.tdv .lnk::after{content:none}
.tdv .nf-h{min-height:18px}
.tdv .gro summary{min-height:44px}
.tdv .fx-late .btn,.tdv .td-setup .btn,.tdv .su .btn.sm{min-height:44px}
.tdv .fx-close .bf-f input{height:44px}
.tdv .bf-f .nf-in{display:block;grid-column:1/-1}
.tdv .bf-f .fmtv{font:700 20px var(--f-cond);color:var(--ink);letter-spacing:0;text-transform:none}
.tdv .bf-f .nf-in{font-size:inherit;letter-spacing:0;text-transform:none;font-weight:400}
.tdv .bf-f.fmt input{color:transparent}
.tdv .o-std[hidden]{display:none}
.tdv .td-setup{flex-wrap:wrap;row-gap:8px}
.tdv .td-setup>span:first-child{flex:1 1 100%}
.tdv .td-sb{display:flex;gap:8px;flex-wrap:nowrap}
.tdv .bf-f.fmt .fmtv{display:flex}
.tdv .tl .body h3 .kc{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.tdv .fx-next{grid-template-columns:auto minmax(0,1fr) auto auto}
.tdv .fx-next .btn{min-height:44px}
/* ===== round 5: Now first, slim day bar, quick-add, compact log ===== */
.tdv .o-brief,.tdv .o-focus{order:1}.tdv .o-quick{order:2}.tdv .o-strip{order:3}.tdv .o-setup{order:4}.tdv .o-bf{order:5}.tdv .o-sched{order:6}.tdv .o-log{order:7}.tdv .o-std{order:8}.tdv .o-notes{order:9}
.tdv .phead h1{font-size:22px}
.tdv .phead .eyebrow{font-size:10.5px}
/* slim day bar (inside the focus card on today, its own small card on other dates) */
.tdv .brief.slim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 12px 10px 16px;align-items:center}
.tdv .focus .brief.slim{border-bottom:1px solid var(--line);background:var(--surface-2)}
.tdv .brief.slim .bt{min-width:0;display:flex;flex-direction:column;gap:3px}
.tdv .brief.slim .row{gap:5px}
.tdv .brief.slim .badge{font-size:11px;padding:2px 7px}
.tdv .brief.slim h2{font-size:16px;line-height:1.25;font-family:var(--f-body);font-weight:700}
.tdv .brief.slim .lead{grid-column:1/-1;font-size:13.5px;color:var(--ink-2)}
.tdv .c4b{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface)}
.tdv .c4b b{font-family:var(--f-cond);font-size:18px;font-variant-numeric:tabular-nums}
.tdv .c4b[aria-expanded="true"]{border-color:var(--accent)}
.tdv .c4d{display:inline-flex;gap:4px}
.tdv .c4d i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.tdv .c4d i.on{background:var(--good)}
.tdv .c4x{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.tdv .c4x[hidden]{display:none}
.tdv .fx-main{padding:14px 16px}
.tdv .fx-title{font-size:21px}
.tdv .fx-foods li{padding:5px 0;font-size:13.5px}
.tdv .fx-next{align-items:start;padding:10px 16px}
.tdv .fx-next .nt{white-space:normal;overflow:visible;line-height:1.3}
.tdv .fx-next .eyebrow,.tdv .fx-next .nw{padding-top:2px}
.tdv .fx-next .btn{align-self:center}
/* quick-add */
.tdv .qa{display:flex;flex-direction:column;gap:8px;min-width:0}
.tdv .qks{display:flex;flex-wrap:wrap;gap:6px}
.tdv .qk{min-height:44px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tdv .qk.on{background:var(--good-soft);border-color:transparent;color:var(--good)}
.tdv .qk.open{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tdv .qk .pl{color:var(--accent);margin-left:4px}
.tdv .qa-in{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 8px 14px}
.tdv .qa-in label{font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tdv .qa-in input{flex:1;min-width:0;height:44px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--surface);color:var(--ink);font:700 20px var(--f-cond);padding:0 10px;font-variant-numeric:tabular-nums}
.tdv .qa-in input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tdv .qa-in .btn{min-height:44px}
/* compact week strip */
.tdv .strip button{min-height:44px;padding:4px 0 5px;gap:0;font-size:10.5px;border-radius:8px}
.tdv .strip button b{font-size:16px}
.tdv .strip button .bar{height:3px;margin-top:1px}
/* compact log */
.tdv .o-log .card-h,.tdv .o-std .card-h,.tdv .o-notes .card-h{padding:10px 16px}
.tdv .o-log .card-h h2,.tdv .o-std .card-h h2,.tdv .o-notes .card-h h2{font-size:18px}
.tdv .nums{gap:8px;padding:12px}
.tdv .nf{padding:7px 10px 8px;gap:1px;border-radius:9px}
.tdv .nf label{font-size:10.5px}
.tdv .nf input{height:30px;font-size:22px}
.tdv .nf[data-nf="weight"] input{height:34px;font-size:26px}
.tdv .fmtv{font-size:22px}
.tdv .nf .tgt{font-size:11px;line-height:1.3}
.tdv .nf .qcs{gap:5px;margin-top:6px}
.tdv .nf .qc{min-width:44px;padding:0 9px;font-size:13px}
/* standards: one line, details on demand */
.tdv .hl li{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 12px}
.tdv .hl .tx{min-width:0;flex:1}
.tdv .hl .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdv .hl .tx .hd{display:block;font-size:12.5px;color:var(--muted);padding:2px 0 4px}
.tdv .hl .tx .hd[hidden]{display:none}
.tdv .hl .hs{flex:none;padding:0 6px;color:var(--muted);font-weight:600}
.tdv .gro-c{margin:4px 0 6px}
.tdv .qks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tdv .qks.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tdv .qk{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;min-height:52px;padding:6px 10px;border-radius:10px;white-space:normal;text-align:left;min-width:0}
.tdv .qk .ql{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tdv .qk .ql em{font-style:normal;color:var(--accent);letter-spacing:0;margin-left:2px}
.tdv .qk .qv{font:700 16px var(--f-cond);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-variant-numeric:tabular-nums}
.tdv .qk:not(.on) .qv{color:var(--accent)}
.tdv .qk.on{background:var(--good-soft);border-color:transparent}
.tdv .qk.on .ql{color:var(--good)}
.tdv .nf .src{display:block}
.tdv .nf .src:empty{display:none}
/* ===== round 6 ===== */
.tdv .qk{min-height:56px}
.tdv .qk .qv{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.15}
.tdv .qk.empty .qv{color:var(--accent)}
.tdv .qk:not(.on):not(.empty) .qv{color:var(--ink)}
.tdv .qk .qh{font-size:11px;color:var(--warn);font-weight:600;line-height:1.2}
.tdv .qa-ed{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.tdv .qa-ed .qa-in{border:0;padding:0 0 0 6px;background:none}
.tdv .qa-ed .qcs{margin:0}
.tdv .qa-in input#qa-in{height:44px;min-height:44px}
.tdv .fx-miss{font-size:14px;color:var(--ink-2)}
.tdv .fx-miss .tlk{height:44px;font-size:14px;text-decoration:underline;text-underline-offset:2px}
.tdv .nf input{height:40px}
.tdv .nf[data-nf="weight"] input{height:44px}
.tdv .strip{margin-top:-4px}
@media (max-width:360px){
  .tdv .qks,.tdv .qks.n3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tdv .phead h1{font-size:20px}
}
/* ===== Train (Builder D) — scoped under .trn / .tr-* so styles.css can't override ===== */
.trn{display:contents}
.tr-vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* exercise blocks */
.trn .tr-lift .intro{padding-bottom:4px}
.trn .tr-lift .intro:empty{display:none}
.trn .exs{display:flex;flex-direction:column}
.trn .ex{display:flex;flex-direction:column;gap:10px;padding:18px 16px 20px;border-top:1px solid var(--line);position:relative}
.trn .exs .ex:first-child{border-top:1px solid var(--line)}
.trn .ex.cur{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
.trn .ex-h{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center}
.trn .ex-h h3{font-size:17px;line-height:1.25}
.trn .ex .ix{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2);font:600 13px var(--f-body);font-variant-numeric:tabular-nums}
.trn .ex.cur .ix{background:var(--accent);color:var(--accent-ink)}
.trn .ex.full .ix{background:var(--good-soft);color:var(--good)}
.trn .ex .now{display:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent);line-height:1.2}
.trn .ex.cur .now{display:block}
.trn .ex .cnt{font:500 13px var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.trn .ex.full .cnt{color:var(--good);font-weight:600}
.trn .ex-sub{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding-left:38px;font-size:13px;color:var(--muted)}
.trn .ex-sub .rx{font:600 13px var(--f-body);font-variant-numeric:tabular-nums}
.trn .last b{font:500 12.5px var(--f-body);font-variant-numeric:tabular-nums}
.trn .ex .note,.trn .ex .last{padding-left:38px}
.trn .prb{padding:2px 8px;font-size:11.5px;letter-spacing:.04em}
.trn .tgt{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-left:38px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.trn .sug{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;min-width:0;font-size:13.5px}
.trn .sug .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.trn .sug b{font-family:var(--f-body);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;color:var(--ink);white-space:nowrap}
.trn .chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.trn .chip.up{background:var(--good-soft);color:var(--good)}
.trn .fillb{min-height:40px}

/* set rows: 48px inputs, 18px type */
.trn .sets2{display:flex;flex-direction:column;gap:8px;max-width:480px}
.trn .srow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 32px;gap:8px;align-items:center}
.trn .srow.hd span{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.trn .srow.hd{margin-bottom:-2px}
.trn .srow .sn{font:500 14px var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted);text-align:center}
.trn .srow.next .sn{color:var(--accent);font-weight:700}
.trn .srow input{width:100%;min-width:0;height:48px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);font:500 18px var(--f-mono);padding:0 12px;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield;transition:border-color .15s,background .15s}
.trn .srow input::-webkit-outer-spin-button,.trn .srow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.trn .srow input::placeholder{color:var(--muted);opacity:.55}
.trn .srow input{scroll-margin-bottom:calc(var(--tr-tabs,0px) + var(--tr-rest,0px) + var(--tr-fin,0px) + 80px);scroll-margin-top:80px}
.trn .srow input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.trn .srow.next input{border-color:var(--accent)}
.trn .srow.ok input{background:var(--surface-2);border-color:var(--line)}
.trn .srow .st{display:grid;place-items:center;height:32px}
.trn .srow .st svg{width:20px;height:20px;stroke:var(--good);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.trn .srow .prt{font:700 10.5px var(--f-body);letter-spacing:.04em;padding:3px 5px;border-radius:5px;background:var(--good);color:var(--check-ink)}

/* finish dock: sticky above the tab bar (and rest dock) on phone, plain footer on desktop */
.trn .tr-fin{position:sticky;bottom:calc(var(--tr-tabs,0px) + var(--tr-rest,0px));z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line-2);border-radius:0 0 var(--r) var(--r)}
.trn .tr-fin.done{position:static;border-top-color:var(--line)}
.trn .tr-fin .fc{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0;flex:1;max-width:220px}
.trn .tr-fin .fc b{font:600 15px var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink)}
.trn .tr-fin .tbar{height:4px}
.trn .tr-fin .tbar i{background:var(--good)}
.trn .tr-fin .btn{min-height:48px;padding-inline:20px;font-size:15px}

/* session summary */
.trn .tr-sum{margin:16px 16px 4px;padding:14px 16px;border-radius:var(--r-s);background:var(--good-soft);display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.trn .tr-sum:focus{outline:none}
.trn .tr-sum .eyebrow{color:var(--good)}
.trn .tr-sum .sg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
@media (min-width:480px){.trn .tr-sum .sg{grid-template-columns:repeat(4,minmax(0,1fr))}}
.trn .tr-sum .sg div{display:flex;flex-direction:column;min-width:0}
.trn .tr-sum .sg b{font-family:var(--f-cond);font-weight:700;font-size:21px;overflow-wrap:anywhere;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.trn .tr-sum .sg b.good{color:var(--good)} .trn .tr-sum .sg b.warn{color:var(--warn)}
.trn .tr-sum .sg span{font-size:11.5px;color:var(--ink-2)}
.trn .tr-sum p{color:var(--ink-2)}

/* intervals */
.trn .tr-iv-c .card-b{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px}
.trn .tr-iv-c .ivt{font-weight:600;font-size:15px}
.trn .tr-iv-c .btn{min-height:44px}
.trn .tctl .btn{min-height:48px;min-width:110px;font-size:15px}

/* rest dock */
.tr-rest{position:fixed;left:0;right:0;bottom:var(--tr-tabs,0px);z-index:9;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:4px 12px;padding:6px 16px;background:var(--surface);border-top:1px solid var(--line-2);color:var(--ink)}
.tr-rest[hidden]{display:none}
.tr-rest .rt{min-width:0}
.tr-rest .rk{font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
.tr-rest .rc{font-size:30px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.tr-rest .rb{display:flex;gap:8px}
.tr-rest .rb .btn{min-height:44px;padding-block:0;min-width:56px;padding-inline:12px;font-size:14px}
.tr-rest .rbar{position:absolute;left:0;right:0;top:0;height:3px;background:var(--sunken)}
.tr-rest .rbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.tr-rest.over{background:var(--good-soft)}
.tr-rest.over .rk,.tr-rest.over .rc{color:var(--good)}
.tr-rest.over .rbar i{background:var(--good)}
body.tr-rest-on{padding-bottom:190px}
@media (max-width:360px){.tr-rest{grid-template-columns:minmax(0,1fr) auto;padding:10px 12px}.tr-rest .rb{grid-column:1/-1}.tr-rest .rb .btn{flex:1}}

@media (min-width:980px){
  .trn .tr-fin{position:static}
  .tr-rest{left:auto;right:24px;bottom:24px;width:400px;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
  body.tr-rest-on{padding-bottom:140px}
}

/* round 3 */
.trn .seg button{min-height:44px}
.trn .tr-sum p.base{color:var(--good);font-weight:600}
.trn .tr-fin.ask{flex-direction:column;align-items:stretch;gap:10px;background:var(--warn-soft);border-top-color:var(--warn)}
.trn .tr-fin.ask .fq{font-size:14.5px;color:var(--ink)}
.trn .tr-fin.ask .fa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trn .tr-fin.ask .fa .btn{min-height:48px;padding-inline:10px}
body.tr-typing .tabs{display:none}
.tr-rest .rn{font-size:14px;font-weight:600;line-height:1.25;color:var(--ink)}
.tr-rest .rk{line-height:1.3}
.tr-rest.over .rc{display:none}
.tr-rest [hidden]{display:none}
.trn .tr-fin{padding-block:8px}

/* round 4: program detail */
.trn .blk{border-radius:var(--r-s);background:var(--accent-soft);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.trn .blk .bt{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.trn .blk .bt b{font-size:14.5px;color:var(--accent)}
.trn .blk .bt span{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.trn .blk p{font-size:13px;color:var(--ink-2)}
.trn .tr-warm{border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.trn .tr-warm summary{list-style:none;cursor:pointer;min-height:48px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.trn .tr-warm summary::-webkit-details-marker{display:none}
.trn .tr-warm summary>span{display:flex;flex-direction:column}
.trn .tr-warm summary b{font-size:15px}
.trn .tr-warm summary::after{content:"Show";font-size:13px;font-weight:600;color:var(--accent)}
.trn .tr-warm[open] summary::after{content:"Hide"}
.trn .tr-warm .wb{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.trn .tr-warm ul,.trn .tr-warm ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.trn .tr-warm .ramp b{font-variant-numeric:tabular-nums}
.trn .ex-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-left:38px}
.trn .eq{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface);white-space:nowrap}
.trn .pair{font-size:12px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.trn .pn{font-size:12.5px;color:var(--ink-2)}
.trn .setup{padding-left:38px;font-size:13px;color:var(--ink-2)}
.trn .ex .was{font-size:12px;color:var(--warn);font-weight:600}
.trn .ex.opt h3{color:var(--ink-2)}
.trn .ex-more{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;padding-left:38px}
.trn .how{flex:1 1 200px;border:1px solid var(--line);border-radius:var(--r-s)}
.trn .how summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:600;color:var(--accent);list-style:none}
.trn .how summary::-webkit-details-marker{display:none}
.trn .how summary::after{content:"+";margin-left:auto;font-size:18px}
.trn .how[open] summary::after{content:"−"}
.trn .how ul{margin:0;padding:0 12px 8px 30px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.trn .how .note{padding:0 12px 10px}
.trn .swap{flex:1 1 160px;display:flex;align-items:center;gap:8px;min-height:44px;border:1px solid var(--line);border-radius:var(--r-s);padding:0 4px 0 12px;font-size:14px;font-weight:600;color:var(--ink-2)}
.trn .swap select{flex:1;min-width:0;height:42px;border:0;background:transparent;color:var(--ink);font:500 14px var(--f-body)}
.trn .ivlead{display:flex;flex-direction:column;gap:4px}
.trn .ivlead .cls{font-size:16px;font-weight:600;color:var(--ink)}
.trn .ivlead .spd b,.trn .timer .spd{font-variant-numeric:tabular-nums}
.trn .timer .spd{font-size:15px;font-weight:600;color:var(--ink-2);min-height:1.2em}
.trn .zones{display:flex;flex-direction:column;gap:6px}
.trn .zg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.trn .z{font-size:12.5px;padding:5px 8px;border-radius:6px;background:var(--sunken);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.trn .z b{color:var(--ink)}
.trn .z.z2,.trn .z.z3{background:var(--good-soft)} .trn .z.z4,.trn .z.z5{background:var(--warn-soft)} .trn .z.z6,.trn .z.z7{background:var(--bad-soft)}
.trn .ftp{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.trn .ftp input{width:110px;height:48px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);font:500 18px var(--f-body);padding:0 12px;font-variant-numeric:tabular-nums}
.trn .fbk{margin-top:4px}
.trn .wch{display:flex;flex-wrap:wrap;gap:6px}
.trn .swap{min-width:0;max-width:100%}
.trn .swap select{width:0;flex:1 1 auto;text-overflow:ellipsis}
.trn .ex-more>*{min-width:0}

/* ===== round 5: focus mode ===== */
.trn .linkbtn{background:none;border:0;color:var(--accent);font:600 14px var(--f-body);padding:0 2px;min-height:44px;cursor:pointer}
.trn .row.pick{min-height:44px}
.trn .progd summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);min-height:32px;display:flex;align-items:center}
.trn .progd p{font-size:13px;color:var(--ink-2)}
.trn .ex{padding:0;gap:0;scroll-margin-top:72px}
.trn .ex.cur{background:none;box-shadow:none}
.trn .exrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:58px;padding:9px 16px;background:none;border:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.trn .ex.open .exrow{cursor:default;padding-top:14px}
.trn .exrow .nm{display:flex;flex-direction:column;gap:1px;min-width:0}
.trn .exn{font-weight:600;font-size:15.5px;line-height:1.25}
.trn .ex.open .exn{font-size:17px;font-weight:700}
.trn .ex.full:not(.open) .exn{color:var(--ink-2)}
.trn .rl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.trn .rl .rx{font:600 12.5px var(--f-body);font-variant-numeric:tabular-nums;color:var(--accent)}
.trn .pt{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--sunken);color:var(--ink-2)}
.trn .ex .ix i{font-style:normal}
.trn .ex .ix svg{display:none;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.trn .ex.full .ix i{display:none}
.trn .ex.full .ix svg{display:block}
.trn .ex .ix{background:var(--sunken);color:var(--ink-2)}
.trn .ex.full .ix{background:var(--good);color:var(--check-ink)}
.trn .ex.open{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
.trn .ex.open:not(.full) .ix{background:var(--accent);color:var(--accent-ink)}
.trn .ex .now{display:none;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.trn .ex.cur:not(.open) .now{display:block}
.trn .exrow .cnt{font:600 13px var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted)}
.trn .ex.full .exrow .cnt{color:var(--good)}
.trn .exb{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px}
.trn .ex:not(.open) .exb{height:0;padding-top:0;padding-bottom:0;overflow:hidden}
.trn .exb .tgt,.trn .exb .last,.trn .exb .note{margin-left:0;padding-left:0}
.trn .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.trn .was{font-size:12.5px;color:var(--warn);font-weight:600}
.trn .srow .pm{grid-column:2/4;font-size:12.5px;color:var(--ink-2);margin-top:-4px;font-variant-numeric:tabular-nums}
.trn .srow .pm:empty{display:none}
.trn .exb .ex-more{padding-left:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.trn .how,.trn .swapd{border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);min-width:0}
.trn .how[open],.trn .swapd[open]{grid-column:1/-1}
.trn .swapd summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:600;color:var(--accent);list-style:none}
.trn .swapd summary::-webkit-details-marker{display:none}
.trn .swapd summary::after{content:"+";margin-left:auto;font-size:18px}
.trn .swapd[open] summary::after{content:"−"}
.trn .hb{padding:0 12px 10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.trn .hb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.trn .how ul{padding:0 0 0 18px}
.trn .sopt{display:block;width:100%;text-align:left;min-height:44px;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:500 14px var(--f-body);white-space:normal;cursor:pointer}
.trn .sopt.on{color:var(--accent);font-weight:700}
.trn .exs{border-top:1px solid var(--line)}
.trn .exs .ex:first-child{border-top:0}
.trn .ex.open .now{display:none}
.trn .card-h .chg{min-height:32px;margin-top:2px;font-size:13.5px}
.trn .tr-iv-c .card-b{padding-block:8px;gap:0 12px}
.trn .tr-iv-c .ivt{font-size:14px;font-weight:600}
.trn .tr-iv-c .linkbtn{min-height:44px}
.trn .blk p{margin:0}
.trn .blk{gap:4px}
.trn .progd summary{min-height:28px}
.trn .rl .ro{display:none}
.trn .ex.open .rl .ro{display:inline}
.trn .card-h .hl{display:flex;flex-wrap:wrap;gap:0 16px}
.trn .exb .tgt{flex-wrap:nowrap;padding:6px 6px 6px 12px}
.trn .exb .tgt .fillb{min-height:40px;font-size:13.5px;white-space:nowrap;padding:0 6px}
.tr-rest{column-gap:10px}
.tr-rest .rn{font-size:13px;line-height:1.25}
.tr-rest .rc{font-size:28px}
.tr-rest .rb{gap:6px}
.tr-rest .rb .btn{min-width:48px;padding-inline:10px}

/* ===== round 6 ===== */
body.tr-rest-on .trn .tr-fin:not(.ask){display:none}
.trn .card-h .chg{min-height:44px;margin-top:0}
.trn details.blk{display:block;padding:0;background:var(--accent-soft);border-radius:var(--r);}
.trn details.blk summary{list-style:none;cursor:pointer;min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:8px 14px}
.trn details.blk summary::-webkit-details-marker{display:none}
.trn details.blk summary b{font-size:14.5px;color:var(--accent)}
.trn details.blk summary span{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.trn details.blk summary::after{content:"Details";margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent)}
.trn details.blk[open] summary::after{content:"Hide"}
.trn details.blk .bb{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink-2)}
/* ===== Progress + Plan (Builder E) ===== */
/* focus banner */
.callout.focus{flex-direction:column;gap:2px;border-left:4px solid var(--accent);background:var(--accent-soft)}
.callout.focus b{font-size:16px;font-weight:600}
/* onboarding */
.onboard h2{font-size:24px}
.onboard p{color:var(--ink-2);max-width:62ch}
/* tiles */
.tile .v small{font-size:18px;color:var(--muted);font-weight:600}
.tile .v.dn{color:var(--good)}
.tile.pace.ok .v{color:var(--good)}
.tile.pace.behind .v{color:var(--warn)}
.tile .s{line-height:1.35}
@media (max-width:400px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:12px}.tile .v{font-size:26px}}
/* chart legend marks */
.legend i.lg-line{height:3px;width:14px;border-radius:2px;background:var(--accent);vertical-align:3px}
.legend i.lg-dot{background:var(--muted);border-radius:50%;width:8px;height:8px;opacity:.75}
.legend i.lg-dash{background:none;border-top:2px dashed var(--muted);height:0;width:14px;border-radius:0;vertical-align:3px}
.legend i.lg-band{background:var(--warn-soft);border:1px solid var(--warn)}
.legend i.lg-future{background:transparent;border:1px dashed var(--line-2)}
.chart-note{padding-top:0}
/* completion grid: cells max ~40px */
.grid12{grid-template-columns:32px repeat(7,minmax(0,40px));max-width:none;justify-content:start}
.grid12 .gh{text-align:center}
.grid12 .c{max-width:40px;min-height:0;cursor:pointer}
.grid12 .c:hover{filter:brightness(1.08);box-shadow:0 0 0 2px var(--line-2)}
/* weekly review stepper */
.review{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.review .card-h h2{margin-top:2px}
.rv-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rv-steps li{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);padding-top:8px;border-top:3px solid var(--line);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-steps li span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);font-size:11px;flex:none}
.rv-steps li.on{color:var(--accent);border-top-color:var(--accent)}
.rv-steps li.on span{background:var(--accent);color:var(--accent-ink)}
.rv-steps li.done{color:var(--ink-2);border-top-color:var(--good)}
.rv-steps li.done span{background:var(--good-soft);color:var(--good)}
@media (max-width:480px){.rv-steps li{font-size:0;gap:0;justify-content:center}.rv-steps li span{font-size:11px}.rv-steps li.on{font-size:12px;gap:6px}}
.rv-body{display:flex;flex-direction:column;gap:12px;min-height:150px}
.rv-lead{color:var(--ink-2)}
.rv-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rv-nums>*{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rv-nums .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rv-nums b{font-family:var(--f-cond);font-size:26px;line-height:1.1}
.rv-nums .s{font-size:12.5px;color:var(--muted)}
.rv-waist input{border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);font:600 18px var(--f-mono);padding:7px 10px;width:100%;min-width:0;min-height:44px}
.rv-waist input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.rv-toggle{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:10px 12px;min-height:56px;width:100%}
.rv-toggle.on{border-color:var(--good);background:var(--good-soft)}
.rv-toggle b{display:block;font-weight:600}
.rv-toggle small{display:block;font-size:12.5px;color:var(--muted)}
.rv-bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rv-bars li{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px}
.rv-bars li.worst>span:first-child{font-weight:600;color:var(--warn)}
.rv-bars .bar{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden}
.rv-bars .bar i{display:block;height:100%;border-radius:5px}
.rv-bars b{text-align:right;font-weight:500;font-size:13px}
.rv-coach{border-left:4px solid var(--accent);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:8px}
.rv-coach.good{border-left-color:var(--good)} .rv-coach.warn{border-left-color:var(--warn)} .rv-coach.bad{border-left-color:var(--bad)}
.rv-coach>b{font-family:var(--f-cond);font-size:20px}
.rv-coach p{color:var(--ink-2)}
.rv-focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.rv-focus button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:11px 12px;min-height:56px;font-size:14px;font-weight:500}
.rv-focus button:hover{border-color:var(--accent)}
.rv-focus button.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.rv-custom{grid-column:1/-1;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.rv-custom input{border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);font:15px var(--f-body);padding:10px 12px;min-height:44px;width:100%}
.rv-custom.on input,.rv-custom input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.rv-foot{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.rv-foot .btn{min-height:44px;min-width:96px}
/* week table */
td .badge{font-family:var(--f-body);font-size:10.5px;padding:1px 6px;vertical-align:1px}

/* ===== Plan ===== */
.dbreak{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-s);background:var(--warn-soft);font-size:13.5px;color:var(--ink)}
.dbreak .badge{background:var(--surface);flex:none}
.meal-t td:first-child{white-space:nowrap}
.meal-t td:first-child b{font-family:var(--f-body);font-weight:600;font-size:13px;display:block}
.meal-t .mt{display:block;font-size:11.5px;color:var(--muted)}
.meal-t td.pf{text-align:left;font-family:var(--f-body);font-size:13px;min-width:180px}
.meal-t tr.tot td{background:var(--surface-2)}
.fs{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:10px}
.fs+.fs{border-top:1px solid var(--line);padding-top:14px}
.fs legend{padding:0;margin-bottom:10px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;float:left;width:100%}
.fs legend+*{clear:both}
.form input{min-height:44px}
.form .hint{font-size:11.5px;color:var(--muted);font-weight:400}
.form .vmsg{font-size:12px;color:var(--bad);font-weight:500;line-height:1.35}
.form .vmsg[hidden]{display:none}
.ref-h{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body);font-weight:600;margin:4px 2px -4px}
.dbody ul.walks{list-style:none;padding-left:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 16px;margin-top:-4px}
.ref-t{min-width:0}
.ref-t tr.db td{background:var(--warn-soft)}
.wkref{display:grid;grid-template-columns:88px minmax(0,1fr)}
.wkref>div{padding:9px 0;border-top:1px solid var(--line)}
.wkref>div:nth-child(-n+2){border-top:0}
.wr-d b{display:block;font-family:var(--f-cond);font-size:16px}
.wr-d span{font-size:11.5px;color:var(--muted);line-height:1.25;display:block;padding-right:8px}
.wr-b{display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.wr-b p.muted{font-size:12.5px}
.wkref .mt{font-family:var(--f-mono);font-size:12px;color:var(--accent);white-space:nowrap}
#redflags>summary h2{color:var(--bad)}
.rv-waist{grid-column:1/-1}
@media (min-width:700px){.rv-nums{grid-template-columns:repeat(3,minmax(0,1fr))}.rv-waist{grid-column:auto}}
.chartbox svg{min-width:0}
.tablebox td:first-child{white-space:nowrap}
.tablebox th{white-space:nowrap}
.meal-t{min-width:0}
@media (max-width:520px){.meal-t th:nth-child(n+4),.meal-t td:nth-child(n+4){display:none}.meal-t td.pf{min-width:0}.meal-t th,.meal-t td{padding-inline:10px}}
[data-targets]{display:flex;flex-direction:column;gap:12px}
.dbody ul.walks{margin-top:0}
/* ---- round 3 ---- */
/* grid: Core 4 count inside each cell (not color alone); 44px max */
.grid12{grid-template-columns:28px repeat(7,minmax(0,44px));gap:4px;padding:12px}
.grid12 .c{max-width:44px;display:grid;place-items:center;font:600 13px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--check-ink)}
.grid12 .c.f{color:var(--ink-2)}
.grid12 .gw{font-size:11px;font-variant-numeric:tabular-nums}
.grid12 .g-up{grid-column:1/-1;margin:4px 0 0;font-size:12.5px;color:var(--muted);text-align:center;border:1px dashed var(--line-2);border-radius:6px;padding:8px}
/* tables: body font with tabular numbers */
.pg-t td,.meal-t td,.ref-t td,.log .mono{font-family:var(--f-body);font-variant-numeric:tabular-nums;font-size:13px}
.pg-t .sh{display:none}
